<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Access — IIT Mandi Ganesh Utsav</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🔒%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="login-page loading">
    <!-- FIXED BACKGROUND -->
    <div id="bg-layer" aria-hidden="true">
        <svg id="bg-canvas" preserveAspectRatio="xMidYMid slice"></svg>
    </div>

    <div class="login-container glass">
        <div class="login-branding">
            <div class="brand-icon">🔒</div>
            <h1>Organiser Access</h1>
            <p>IIT Mandi Ganesh Utsav</p>
        </div>

        <!-- STAGE 1: Identity -->
        <form id="stage-1" class="login-stage active">
            <h2>Verify Identity</h2>
            <div class="form-group">
                <label for="login-name">Organiser Name</label>
                <input type="text" id="login-name" placeholder="Your full name" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="login-pin">6-Digit PIN</label>
                <input type="password" id="login-pin" inputmode="numeric" pattern="[0-9]*"
                       maxlength="6" placeholder="••••••" autocomplete="off" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="stage1-btn">Verify</button>
            </div>
            <div class="login-error" id="stage-1-error"></div>
        </form>

        <!-- STAGE 2: Password -->
        <form id="stage-2" class="login-stage">
            <h2>Enter Password</h2>
            <p class="name-display" id="stage-2-name"></p>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="stage2-btn">Sign In</button>
            </div>
            <button type="button" class="link-btn" id="back-to-stage-1">← Go Back</button>
            <div class="login-error" id="stage-2-error"></div>
        </form>

        <a href="index.html" class="back-home">← Back to website</a>
    </div>

    <script type="module" src="js/dashboard-auth.js"></script>
</body>
</html>
